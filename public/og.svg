<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="55%" r="65%">
      <stop offset="40%" stop-color="rgba(10,12,10,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0c0a"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- top bar mock -->
  <g fill="#8c9389" font-size="18">
    <text x="60" y="60"><tspan fill="#6dff8e">~$</tspan> <tspan fill="#d4d8cf">marc@archer:/portfolio</tspan></text>
  </g>
  <line x1="60" y1="82" x2="1140" y2="82" stroke="#1d211c" stroke-dasharray="4 4"/>

  <!-- wordmark / name -->
  <g fill="#d4d8cf">
    <text x="60" y="240" font-size="130" font-weight="500" letter-spacing="-6">marc archer</text>
    <text x="60" y="370" font-size="130" font-weight="500" letter-spacing="-6">ciscar<tspan fill="#6dff8e">▮</tspan></text>
  </g>

  <!-- meta row -->
  <g font-size="22">
    <rect x="60" y="404" width="280" height="40" fill="none" stroke="#4ea968"/>
    <text x="200" y="431" text-anchor="middle" fill="#6dff8e">full_stack_engineer</text>
    <text x="370" y="431" fill="#d4d8cf"><tspan fill="#6dff8e">●</tspan> @ farmavázquez</text>
    <text x="660" y="431" fill="#8c9389">· valencia, españa</text>
  </g>

  <!-- principle -->
  <g font-size="24">
    <line x1="60" y1="480" x2="60" y2="540" stroke="#4ea968" stroke-width="3"/>
    <text x="84" y="520" fill="#8c9389"><tspan fill="#6dff8e">› </tspan><tspan fill="#d4d8cf">la tecnología, al servicio del problema.</tspan></text>
  </g>

  <!-- footer line -->
  <line x1="60" y1="572" x2="1140" y2="572" stroke="#1d211c" stroke-dasharray="4 4"/>
  <g fill="#8c9389" font-size="16">
    <text x="60" y="600">construido a mano · sin trackers · sin cookies</text>
    <text x="1140" y="600" text-anchor="end">marcarcherciscar.com</text>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
